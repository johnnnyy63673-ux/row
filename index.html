<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Vitality · Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400;1,6..72,500&family=JetBrains+Mono:wght@400;500;600&display=swap">

<style>
:root {
  --bg: #000000;
  --fg: #ffffff;
  --accent: #6EE7B7;
  --accent-glow: rgba(110, 231, 183, 0.4);
  --muted: rgba(255, 255, 255, 0.5);
  --border: rgba(255, 255, 255, 0.08);
  --card: rgba(255, 255, 255, 0.02);
  --amber-warm: #d97706;
  --wine: #7c2d12;
  --space-6: 1.5rem;
  --text-sm: 0.875rem; --text-xl: 1.375rem;
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-serif: 'Newsreader', 'Times New Roman', Georgia, serif;
  --font-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out-soft: cubic-bezier(0.32, 0.72, 0, 1);
  --duration: 180ms; --duration-lift: 480ms;
}

* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; }
body { background:var(--bg); color:var(--fg); font-family:var(--font-sans);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
a { color:inherit; text-decoration:none; }

#vt-backdrop { position:fixed; inset:0; z-index:-1; pointer-events:none; overflow:hidden; background:var(--bg); }
#vt-backdrop .wb-atmosphere { position:absolute; inset:0;
  background:radial-gradient(60% 50% at 50% 32%, rgba(110,231,183,0.16) 0%, rgba(110,231,183,0.05) 34%, rgba(110,231,183,0) 66%),
  radial-gradient(34% 26% at 50% 38%, rgba(255,226,181,0.06) 0%, rgba(255,226,181,0) 72%),
  radial-gradient(130% 90% at 50% 120%, rgba(14,38,30,0.8) 0%, rgba(0,0,0,1) 72%); }
#vt-backdrop .wb-mountains { position:absolute; left:0; right:0; bottom:0; height:40vh; min-height:220px; }
#vt-backdrop .wb-mountains svg { width:100%; height:100%; display:block; }
#vt-backdrop .wb-particles { position:absolute; inset:0; }
#vt-backdrop .wb-particles span { position:absolute; width:1.5px; height:1.5px; background:rgba(233,239,233,0.55);
  border-radius:50%; box-shadow:0 0 4px rgba(167,243,208,0.35); animation:vtDrift linear infinite; }
@keyframes vtDrift { 0%{transform:translate3d(0,0,0);opacity:0} 8%{opacity:0.7} 92%{opacity:0.5} 100%{transform:translate3d(var(--dx,12px),var(--dy,-100vh),0);opacity:0} }
#vt-grain { position:fixed; inset:0; z-index:9999; pointer-events:none; opacity:0.05; mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); background-size:200px 200px; }

.top { position:sticky; top:0; z-index:50; display:flex; align-items:center;
  padding:16px max(var(--space-6), env(safe-area-inset-left));
  border-bottom:1px solid var(--border);
  background:rgba(0,0,0,0.55); backdrop-filter:blur(18px) saturate(1.3); -webkit-backdrop-filter:blur(18px) saturate(1.3); }
.top__brand { font-family:var(--font-serif); font-style:italic; font-size:1.125rem; letter-spacing:-0.015em; }
.top__brand b { color:var(--accent); font-weight:500; }
.top__date { margin-left:auto; font-family:var(--font-mono); font-size:11px; letter-spacing:0.1em;
  text-transform:uppercase; color:var(--muted); }

.shell { min-height:calc(100vh - 57px); display:flex; align-items:center; justify-content:center;
  padding:var(--space-6); padding-bottom:calc(var(--space-6) + env(safe-area-inset-bottom)); }

/* 4-col, 3-row bento */
.dk-grid {
  display:grid;
  grid-template-columns: repeat(4, 1fr);
  grid-template-rows: minmax(200px,auto) minmax(200px,auto) minmax(160px,auto);
  gap:16px;
  width:100%;
  max-width:1100px;
}
@media (max-width:980px){
  .dk-grid { grid-template-columns:repeat(2,1fr); grid-auto-rows:minmax(160px,auto); }
}
@media (max-width:560px){
  .dk-grid { grid-template-columns:1fr 1fr; grid-auto-rows:minmax(130px,auto); gap:10px; }
}

.dk-poster { position:relative; overflow:hidden; border-radius:18px; border:1px solid var(--border);
  background:var(--card); isolation:isolate; display:block; width:100%; text-align:left;
  color:inherit; opacity:0; transform:translateY(12px) scale(0.97);
  animation:dk-posterIn 800ms var(--ease-premium) forwards;
  transition:transform var(--duration-lift) var(--ease-premium), border-color var(--duration) var(--ease);
  will-change:transform; }
@keyframes dk-posterIn { to { opacity:1; transform:translateY(0) scale(1); } }
.dk-poster:hover { border-color:rgba(110,231,183,0.35); box-shadow:0 0 40px rgba(110,231,183,0.08); transform:translateY(-2px) scale(1.005); }
.dk-poster:active { transform:scale(0.98); }

.dk-poster__art { position:absolute; inset:-10%; pointer-events:none; transition:transform 300ms var(--ease-out-soft); will-change:transform; }
.dk-poster:hover .dk-poster__art { transform:scale(1.04); }

.dk-poster__index { position:absolute; top:16px; left:16px; z-index:2;
  font-family:var(--font-serif); font-style:italic; font-size:var(--text-sm); color:rgba(255,255,255,0.45); }
.dk-poster__label { position:absolute; bottom:16px; left:16px; z-index:2;
  font-family:var(--font-serif); font-style:italic; font-size:var(--text-xl); color:rgba(255,255,255,0.9);
  letter-spacing:-0.015em; line-height:1; transition:color var(--duration) var(--ease); }
.dk-poster:hover .dk-poster__label { color:var(--accent); }
.dk-poster__arrow { position:absolute; bottom:16px; right:16px; z-index:2;
  font-family:var(--font-serif); font-style:italic; font-size:var(--text-xl); color:rgba(255,255,255,0.4);
  transition:color var(--duration) var(--ease), transform var(--duration) var(--ease); }
.dk-poster:hover .dk-poster__arrow { color:var(--accent); transform:translateX(3px); }

/* Explicit grid placement */
.tile-gym     { grid-column:1/3; grid-row:1/3; }  /* hero 2x2 */
.tile-vitals  { grid-column:3;   grid-row:1/3; }  /* tall 1x2 */
.tile-peak    { grid-column:4;   grid-row:1/3; }  /* tall 1x2 */
.tile-goals   { grid-column:1;   grid-row:3; }
.tile-finance { grid-column:2;   grid-row:3; }
.tile-fuel    { grid-column:3/5; grid-row:3; }    /* wide 2x1 */

@media (max-width:980px){
  .tile-gym,.tile-vitals,.tile-peak,.tile-goals,.tile-finance,.tile-fuel {
    grid-column:auto; grid-row:auto;
  }
  .tile-gym { grid-column:span 2; }
  .tile-fuel { grid-column:span 2; }
}
@media (max-width:560px){
  .tile-gym { grid-column:span 2; }
  .tile-fuel { grid-column:span 2; }
  .tile-vitals,.tile-peak,.tile-goals,.tile-finance { grid-column:span 1; }
}

.dk-poster:nth-child(1){animation-delay:60ms}
.dk-poster:nth-child(2){animation-delay:120ms}
.dk-poster:nth-child(3){animation-delay:180ms}
.dk-poster:nth-child(4){animation-delay:240ms}
.dk-poster:nth-child(5){animation-delay:300ms}
.dk-poster:nth-child(6){animation-delay:360ms}

/* Art fills */
.dk-art--aurora { background:radial-gradient(ellipse 65% 50% at 30% 35%, rgba(110,231,183,0.55), transparent 60%),
  radial-gradient(ellipse 70% 55% at 75% 70%, rgba(31,77,61,0.85), transparent 65%),
  radial-gradient(ellipse 40% 40% at 60% 30%, rgba(245,158,11,0.10), transparent 70%),
  linear-gradient(180deg,#052e22 0%,#000 100%); filter:saturate(1.1); animation:dk-auroraDrift 28s ease-in-out infinite alternate; }
@keyframes dk-auroraDrift { 0%{transform:scale(1) rotate(0deg)} 100%{transform:scale(1.08) rotate(8deg)} }

.dk-art--frosted { background:radial-gradient(ellipse 60% 50% at 30% 30%, rgba(110,231,183,0.5), transparent 65%),
  radial-gradient(ellipse 70% 60% at 75% 70%, rgba(67,56,202,0.45), transparent 65%),
  linear-gradient(180deg,#0a0a1e 0%,#02020a 100%); filter:saturate(1.2); }
.dk-art--frosted::after { content:''; position:absolute; width:70%; height:70%; top:15%; left:15%; border-radius:50%;
  background:rgba(255,255,255,0.04); backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,0.06); animation:dk-frostedBob 16s ease-in-out infinite alternate; }
@keyframes dk-frostedBob { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(4%,-3%) scale(1.04)} }

.dk-art--duotone { background:radial-gradient(ellipse 80% 60% at 30% 30%, rgba(245,158,11,0.35), transparent 65%),
  linear-gradient(135deg, var(--amber-warm) 0%, var(--wine) 65%, #1a0808 100%); animation:dk-duotoneShift 22s ease-in-out infinite alternate; }
@keyframes dk-duotoneShift { 0%{filter:saturate(0.95) hue-rotate(0deg)} 100%{filter:saturate(1.05) hue-rotate(-6deg)} }

.dk-art--grid { background:repeating-linear-gradient(45deg, transparent 0 22px, rgba(110,231,183,0.05) 22px 23px),
  repeating-linear-gradient(-45deg, transparent 0 22px, rgba(255,255,255,0.025) 22px 23px),
  linear-gradient(135deg,#050a08 0%,#000 100%); animation:dk-gridDrift 40s linear infinite; }
@keyframes dk-gridDrift { from{background-position:0 0,0 0,0 0} to{background-position:220px 0,-220px 0,0 0} }

.dk-art--dots { background:radial-gradient(circle, rgba(110,231,183,0.45) 1px, transparent 1.5px),
  radial-gradient(ellipse 60% 80% at 50% 50%, rgba(110,231,183,0.08), transparent 65%),
  linear-gradient(180deg,#04130d 0%,#000 100%); background-size:16px 16px,100% 100%,100% 100%; animation:dk-dotsRotate 120s linear infinite; }
@keyframes dk-dotsRotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

.dk-art--coral { background:radial-gradient(60% 45% at 82% 14%, rgba(224,118,88,0.55), transparent 55%),
  radial-gradient(55% 45% at 18% 90%, rgba(180,180,200,0.15), transparent 55%),
  linear-gradient(180deg,#1a0a06,#050506); animation:dk-coralShift 24s ease-in-out infinite alternate; }
@keyframes dk-coralShift { 0%{filter:saturate(0.9)} 100%{filter:saturate(1.15) hue-rotate(8deg)} }
</style>
</head>
<body>

<div id="vt-backdrop" aria-hidden="true">
  <div class="wb-atmosphere"></div>
  <div class="wb-mountains">
    <svg viewBox="0 0 1600 420" preserveAspectRatio="none">
      <defs>
        <linearGradient id="mt-far" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0d1a17" stop-opacity="0"/>
          <stop offset="55%" stop-color="#0d1a17" stop-opacity=".55"/>
          <stop offset="100%" stop-color="#0d1a17" stop-opacity=".95"/>
        </linearGradient>
        <linearGradient id="mt-near" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#050a09" stop-opacity=".4"/>
          <stop offset="60%" stop-color="#050a09" stop-opacity=".95"/>
          <stop offset="100%" stop-color="#050a09" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <path d="M0,300 L120,230 L210,260 L320,180 L430,220 L560,150 L680,210 L820,170 L960,220 L1100,180 L1240,240 L1380,200 L1500,250 L1600,220 L1600,420 L0,420 Z" fill="url(#mt-far)"/>
      <path d="M0,360 L100,320 L220,340 L340,290 L460,330 L590,300 L720,340 L860,310 L1000,350 L1140,310 L1280,355 L1420,320 L1540,360 L1600,340 L1600,420 L0,420 Z" fill="url(#mt-near)"/>
    </svg>
  </div>
  <div class="wb-particles" id="wb-particles"></div>
</div>
<div id="vt-grain" aria-hidden="true"></div>

<header class="top">
  <div class="top__brand">Vitality <b>Dashboard</b></div>
  <div class="top__date" id="topDate"></div>
</header>

<main class="shell">
  <div class="dk-grid">

    <a href="gym.html" class="dk-poster tile-gym">
      <div class="dk-poster__art dk-art--aurora"></div>
      <span class="dk-poster__index">01</span>
      <span class="dk-poster__label">Gym</span>
      <span class="dk-poster__arrow">→</span>
    </a>

    <a href="health.html" class="dk-poster tile-vitals">
      <div class="dk-poster__art dk-art--dots"></div>
      <span class="dk-poster__index">02</span>
      <span class="dk-poster__label">Vitals</span>
      <span class="dk-poster__arrow">→</span>
    </a>

    <a href="peak.html" class="dk-poster tile-peak">
      <div class="dk-poster__art dk-art--frosted"></div>
      <span class="dk-poster__index">03</span>
      <span class="dk-poster__label">Peak</span>
      <span class="dk-poster__arrow">→</span>
    </a>

    <a href="goals.html" class="dk-poster tile-goals">
      <div class="dk-poster__art dk-art--grid"></div>
      <span class="dk-poster__index">04</span>
      <span class="dk-poster__label">Goals</span>
      <span class="dk-poster__arrow">→</span>
    </a>

    <a href="finance.html" class="dk-poster tile-finance">
      <div class="dk-poster__art dk-art--coral"></div>
      <span class="dk-poster__index">05</span>
      <span class="dk-poster__label">Finance</span>
      <span class="dk-poster__arrow">→</span>
    </a>

    <a href="po-water.html" class="dk-poster tile-fuel">
      <div class="dk-poster__art dk-art--duotone"></div>
      <span class="dk-poster__index">06</span>
      <span class="dk-poster__label">Fuel</span>
      <span class="dk-poster__arrow">→</span>
    </a>

  </div>
</main>

<script>
(function () {
  var root = document.getElementById('wb-particles');
  if (!root) return;
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var N = window.innerWidth < 640 ? 10 : 20;
  for (var i = 0; i < N; i++) {
    var s = document.createElement('span');
    var dur = 18 + Math.random() * 22;
    var size = 1 + Math.random() * 1.2;
    s.style.left = (Math.random() * 100) + '%';
    s.style.top = (60 + Math.random() * 40) + 'vh';
    s.style.width = s.style.height = size + 'px';
    s.style.animationDuration = dur + 's';
    s.style.animationDelay = (-Math.random() * dur) + 's';
    s.style.setProperty('--dx', (Math.random() * 30 - 15) + 'px');
    s.style.setProperty('--dy', (-(60 + Math.random() * 50)) + 'vh');
    root.appendChild(s);
  }
})();

(function () {
  var el = document.getElementById('topDate');
  if (!el) return;
  var d = new Date();
  el.textContent = d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' }).toUpperCase();
})();
</script>
</body>
</html>
